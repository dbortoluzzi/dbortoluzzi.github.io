params:
  title: "Daniele Bortoluzzi"
  description: "Software architect, IoT, R&D"
  # Open Graph / Twitter: first image used as social preview (absolute path from site root)
  images:
    - /images/me.jpg
  # staticPath: ""  # The path to serve the static files from
  favicon: "/penguin.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # Original textLinkColor and primaryColor: "#007bff"
  color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
    textLinkColor: "#3D8D7A"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
    primaryColor: "#3D8D7A"
  #   secondaryColor: "#f8f9fa"

  # Original textLinkColor and primaryColor: "#ffffff"
    darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
      textLinkColor: "#3D8D7A"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
      primaryColor: "#3D8D7A"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "bortoluzzi.labs" # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: true
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Daniele Bortoluzzi."
    subtitle: "Software architect, IoT, R&D"
    content: |-
      I’m a computer scientist with **15 years** of experience from design through production.

      I focus on **Java** ecosystems and **microservices** (Spring, Quarkus), **cloud-native** backends on **AWS**, and **data / AI** delivered reliably in production—combined with **team leadership**, **turnkey delivery**, and **mentoring**.

      I also **lecture** on cloud and distributed systems (containers, microservices, Spring, Docker, Kubernetes, OpenStack) and keep an **R&D** thread in **swarm intelligence**, **agent-based** coordination, and **IoT / robotics**.
    image: /images/hero.svg
    bottomImage:
      enable: false
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/cv/CV_DanieleBortoluzzi.pdf"
      download: true
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/dbortoluzzi
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/daniele-bortoluzzi-7a704363/
        - icon: fas fa-envelope
          url: mailto:bortoluzzi.labs@gmail.com

      # customIcons:
      #   - icon: /fav.png
      #     url: "https://example.com"

 # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      I offer consultancy across **cloud-native platforms**, **data and AI in production**, and **industrial IoT** (including Agriculture 4.0), from architecture through to rollout. I combine hands-on engineering with **team leadership**, **turnkey delivery**, and **mentoring**.

      I lecture for universities and partner programmes—currently including the University of Turin’s Master’s in Cloud Computing (COREP)—and I maintain an active **R&D** thread in swarm intelligence and robotics, with rovers, drones, and embedded prototypes tied to experiments and field deployments.
    skills:
      enable: true
      title: "Here are a few technologies and skills I've been working with recently:"
      items:
        - "Java"
        - "Microservices"
        - "Spring Framework"
        - "Quarkus"
        - "Kubernetes"
        - "AWS"
        - "Linux"
        - "Python"
        - "TypeScript"
        - "C++"
        - "ROS2"
        - "Teamwork"
        - "Problem-solving"
        - "Mentoring"
        - "Leadership"
        - "Communication"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - job: "Freelance IT Consultant"
        company: "Self-employed"
        companyUrl: "https://www.linkedin.com/in/daniele-bortoluzzi-7a704363/"
        date: "Mar 2025 - Present"
        content: |-
          Freelance consultant across **cloud-native** delivery, **software architecture**, **agent-based AI**, **IoT**, **robotics**, and **swarm intelligence** (heterogeneous fleets, drones, field systems).

          I lead and mentor teams from design through **turnkey rollout**: **data** and **AI** pipelines, **industrial** solutions, and **Agriculture 4.0** use cases.
          - **Microservice** architectures (independent services with **Quarkus**), **React** front ends consuming those APIs, and integration across distributed components.
          - Consultancy on **agent-based** and conventional AI platforms; **frameworks for distributed intelligence** in IoT and robotics; **architectures for drone swarms** and heterogeneous fleets.
          - **Data ingestion** pipelines and dashboards for monitoring, exploration, and operational use of large datasets.
          - Deployment on **AWS** and **infrastructure-as-code**: provisioning environments with **Terraform**.
          - **AI** projects for data analysis, **computer vision**, and models **deployed on embedded devices**, including Agriculture 4.0 use cases.

          Tech: Java, Python; Quarkus, React (TypeScript), microservices, Redis, AWS, Terraform; agentic AI frameworks; ROS2, Gazebo, aggregate programming
      - job: "Contract Lecturer"
        company: "COREP · University of Turin"
        companyUrl: "https://www.unito.it/"
        date: "Nov 2025 - Apr 2026"
        content: |-
          Teaching on site for the **Master’s in Cloud Computing for AI and IoT** (first-level university master’s, University of Turin, organized with COREP).
          - Led the course **“Containerization and Virtualization Platforms”** (Spring Boot, microservices, Docker, Kubernetes, OpenStack).

          Tech: Spring Boot, microservices, Docker, Kubernetes, OpenStack, Java
      - job: "Research Fellow"
        company: "University of Turin · Computer Science"
        companyUrl: "https://www.di.unito.it/"
        date: "Mar 2023 - Feb 2025"
        content: |-
          Within the **MoVeRe** research group: research on **Aggregate Programming** for coordination among heterogeneous entities.
          - Participation in the **PRIN 2020 COMMON-WEARS** project.
          - Verticalizations and PoC in **robotics** (drones and ground robots/rovers) and **Industry 4.0**.
          - Teaching support for **“Web Technologies”** and **“Programming for Mobile Devices”**, including **A.Y. 2025–2026**.

          Tech: ROS2 (Python, C++), Gazebo (Python), Zephyr (C, C++), Arduino (C), Spring Boot (Java), Angular (TypeScript)

      - job: "Solution Architect"
        company: "GFT Italia"
        companyUrl: "https://www.gft.com/"
        date: "Oct 2021 - Mar 2023"
        content: |-
          Consulting on **software architecture** and **microservice-based** solutions for insurance clients.
          - Technical reference and coordination of development teams; training and coaching.
          - Design and coordination of the IT solution for a new **core customer registry** for a lead insurance group.

          Tech: Java 11+, Spring Boot, Oracle, Spring Cloud, Redis, DB2, MyBatis, Tomcat, IBM WebSphere, SQL, GitLab, Maven, REST, IBM MQ, Apache Kafka

      - job: "Senior Software Developer / Technical Leader"
        company: "Xeffe Srl"
        date: "Jan 2017 - Oct 2021"
        content: |-
          Analysis, coordination, and development of **enterprise solutions** for the finance market (**DDD**, enterprise integration patterns).
          - Development and maintenance of proprietary frameworks based on **Apache Camel** and **Play Framework**.

          Tech: Java 8+, Scala, JavaScript, Spring, SQL, Apache Camel, Play Framework, Oracle, H2, MyBatis, GitHub, Ansible, Maven, nginx, SOAP, REST, jQuery, BeanIO, Quartz

      - job: "Software engineer — earlier roles"
        company: "Various employers · Italy"
        date: "Jun 2011 - Jan 2017"
        content: |-
          Earlier career in **Java** development, integrations, and **full-stack** delivery—**finance** and **travel / booking** domains—progressing from analyst/developer to technical lead responsibilities.
          - **Prosa** — EmotiVending / VeBox (Java, C++, Ruby).
          - **NaturalBooking** — back end of **Hospes** booking engine; SOAP integrations; server ops.
          - **Creatiweb** — proprietary booking engine, WebServices, **IT manager** for server farm.
          - **Audacia** — intelligent **big data** analysis platform; Java and Node.js stack.

          Tech: Java, SOAP/REST, SQL, JavaScript/AngularJS, Tomcat, Firebird/Oracle, Node.js (Audacia), integrations and ops.

